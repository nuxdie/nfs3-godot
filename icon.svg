<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c12"/>
      <stop offset="0.52" stop-color="#2a1408"/>
      <stop offset="0.6" stop-color="#ff6b1f"/>
      <stop offset="0.6" stop-color="#15161c"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3c46"/>
      <stop offset="1" stop-color="#1c1d24"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd966"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#ffb81a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb81a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="skyonly">
      <rect x="0" y="0" width="128" height="76.8"/>
    </clipPath>
    <clipPath id="tile">
      <rect x="4" y="4" width="120" height="120" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="128" height="128" fill="url(#sky)"/>
    <ellipse cx="64" cy="77" rx="60" ry="26" fill="url(#glow)" clip-path="url(#skyonly)"/>

    <!-- road sweeping to the horizon -->
    <path d="M-6 128 C 30 108, 58 96, 62 76.8 L 66 76.8 C 72 96, 104 108, 134 128 Z" fill="url(#road)"/>
    <path d="M-6 128 C 30 108, 58 96, 62 76.8" fill="none" stroke="#f2f2f2" stroke-opacity="0.8" stroke-width="2.2"/>
    <path d="M134 128 C 104 108, 72 96, 66 76.8" fill="none" stroke="#f2f2f2" stroke-opacity="0.8" stroke-width="2.2"/>
    <!-- centre dashes -->
    <path d="M58 128 L 62 113 L 66.5 113 L 70 128 Z" fill="url(#amber)"/>
    <path d="M61.6 104 L 63 95 L 65.4 95 L 66.6 104 Z" fill="url(#amber)"/>
    <path d="M63.3 89 L 63.8 84 L 64.8 84 L 65.2 89 Z" fill="url(#amber)"/>

    <!-- pursuit light bar -->
    <rect x="18" y="20" width="44" height="9" rx="3" fill="#ff2a3a"/>
    <rect x="66" y="20" width="44" height="9" rx="3" fill="#2a7bff"/>
    <rect x="18" y="20" width="44" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="66" y="20" width="44" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.35"/>

    <!-- slanted III, like the menu's slant buttons -->
    <g transform="translate(64 53) skewX(-14)">
      <path d="M-27 -16 h11 v30 h-11 z M-5.5 -16 h11 v30 h-11 z M16 -16 h11 v30 h-11 z" fill="#000" fill-opacity="0.45" transform="translate(2 2)"/>
      <path d="M-27 -16 h11 v30 h-11 z M-5.5 -16 h11 v30 h-11 z M16 -16 h11 v30 h-11 z" fill="url(#amber)"/>
    </g>
  </g>
  <rect x="5" y="5" width="118" height="118" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
